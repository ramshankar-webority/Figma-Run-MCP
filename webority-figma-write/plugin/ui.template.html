<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Zalando Sans (variable, latin) embedded as base64: the plugin iframe has no
         network access beyond the local bridge, so the font cannot be linked from Google. */
      @font-face {
        font-family: "Zalando Sans";
        font-style: normal;
        font-display: block;
        font-weight: 200 900;
        src: url(data:font/woff2;base64,__FONT_B64__) format("woff2-variations");
      }
      /* Webority palette: primary blue, slate text scale, and the success/warning/error sets. */
      :root {
        --bg: #f5f6fa; --card: #ffffff; --line: #ebedf3;
        --ink: #071437; --muted: #78829d; --faint: #99a1b7;
        --blue: #2f50e4; --blue-soft: #ebeefd; --blue-hover: #4764e4; --blue-pressed: #193ee4;
        --ok: #04b440; --ok-soft: #e8faee;
        --bad: #e82646; --bad-soft: #ffeaef;
        --warn: #dfa000; --warn-soft: #fff8e6;
        --wait: #78829d; --wait-soft: #ebedf3;
        --off: #c4cada;
        --r-lg: 24px; --r-md: 24px; --r-sm: 12px;
      }
      * { box-sizing: border-box; }
      /* Corner smoothing 100% (Figma squircle). corner-shape is ignored by older engines,
         which then simply render the plain 20px radius. */
      #status, .card, .stat, #log {
        corner-shape: squircle;
      }
      /* The switch and its knob stay true pills: radius 999px, no corner smoothing. */
      .switch, .track, .track::after, button { corner-shape: round; }
      body {
        font-family: "Zalando Sans", Inter, -apple-system, system-ui, sans-serif;
        margin: 0; padding: 12px 12px 14px; background: var(--bg); color: var(--ink);
        font-size: 12px; line-height: 1.4; -webkit-font-smoothing: antialiased;
      }
      .grow { flex: 1; min-width: 0; }
      .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor;
            stroke-linecap: round; stroke-linejoin: round; }
      /* Iconsax Bulk: two-tone fills, no stroke. Used for the card rows. */
      svg.bulk { fill: currentColor; stroke: none; width: 19px; height: 19px; }

      header { display: flex; align-items: center; gap: 8px; padding: 0 4px; margin-bottom: 12px; }
      header h1 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
      .ver { font-size: 11px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }

      /* Connection banner */
      #status {
        display: flex; align-items: center; gap: 9px; padding: 12px 13px;
        border-radius: var(--r-lg); font-weight: 700; background: var(--wait-soft); color: var(--wait);
        text-transform: uppercase; letter-spacing: .03em; font-size: 11px;
      }
      /* Connected is the one solid state: success-active fill, light text. Every other
         state keeps a light tint with dark text. */
      #status.ok { background: var(--ok); color: #ffffff; }
      #status.bad { background: var(--bad-soft); color: var(--bad); }
      #status.warn { background: var(--warn-soft); color: var(--warn); }
      #status.wait svg { animation: spin 2.4s linear infinite; }
      #status.warn svg, #status.bad svg { animation: none; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Cards */
      .card { background: var(--card); border-radius: var(--r-lg); padding: 4px 0; margin-top: 10px; }
      .rowitem { display: flex; align-items: center; gap: 12px; padding: 11px 13px; }
      .rowitem + .rowitem { border-top: 1px solid var(--line); }
      .rowitem .ic { color: var(--muted); }
      #allowRow.on .ic { color: var(--blue); }
      .title { font-weight: 600; }
      .desc { color: var(--muted); font-size: 11px; margin-top: 1px; }
      .chip {
        flex: none; font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
        background: var(--wait-soft); color: var(--muted);
      }
      .chip.dev { background: var(--warn-soft); color: var(--warn); }

      /* One UI switch */
      .switch { flex: none; position: relative; width: 44px; height: 26px; }
      .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; }
      .track {
        position: absolute; inset: 0; border-radius: 999px; background: var(--off);
        transition: background .2s ease;
      }
      .track::after {
        content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
        border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.22);
        transition: transform .2s cubic-bezier(.2,.8,.3,1);
      }
      .switch input:checked + .track { background: var(--blue); }
      .switch input:checked + .track::after { transform: translateX(18px); }
      .switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--blue-soft); }
      #allowRow.on .title { color: var(--blue); }

      /* Counters */
      .stats { display: flex; gap: 8px; margin-top: 10px; }
      .stat { flex: 1; background: var(--card); border-radius: var(--r-md); padding: 9px 6px; text-align: center; }
      .stat b { display: block; font-family: "Zalando Sans", Inter, sans-serif; font-size: 17px; font-weight: 700; font-variant-numeric: proportional-nums; line-height: 1.15; }
      .stat span { font-size: 9.5px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
      .stat.err b { color: var(--bad); }

      /* Activity */
      .head svg { width: 17px; height: 17px; }
      .head { display: flex; align-items: center; gap: 7px; margin: 13px 6px 6px; color: var(--muted); }
      .head .lbl { font-size: 11px; font-weight: 700; letter-spacing: .01em; }
      .head .when { margin-left: auto; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
      #log { background: var(--card); border-radius: var(--r-lg); max-height: 250px; overflow-y: auto; padding: 4px 0; }
      #log::-webkit-scrollbar { width: 6px; }
      #log::-webkit-scrollbar-thumb { background: var(--off); border-radius: 999px; }
      #log .empty { padding: 18px 14px; text-align: center; color: var(--faint); font-size: 11px; }
      .item { padding: 9px 14px; cursor: pointer; }
      .item + .item { border-top: 1px solid var(--line); }
      .item:hover { background: var(--bg); }
      .item .top { display: flex; align-items: center; gap: 10px; }
      .item .sub { margin: 2px 0 0 17px; color: var(--muted); font-size: 10.5px; }
      .item .more { display: none; margin: 8px 0 2px 17px; }
      .item.open .more { display: block; }
      .item.open { background: var(--bg); }
      .layer { background: var(--card); border-radius: var(--r-sm); padding: 7px 9px; margin-top: 5px; }
      .layer .ln { display: flex; gap: 6px; align-items: baseline; }
      .layer .nm { font-weight: 600; font-size: 11px; }
      .layer .tp { flex: none; font-size: 9px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 1px 6px; }
      .layer .sz { flex: none; margin-left: auto; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
      .layer .wh { color: var(--muted); font-size: 10px; margin-top: 2px; }
      .tags { display: flex; flex-wrap: wrap; gap: 5px; }
      .tag { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--wait-soft); color: var(--muted); }
      .tag.c { background: var(--ok-soft); color: var(--ok); }
      .tag.e { background: var(--blue-soft); color: var(--blue); }
      .tag.d { background: var(--bad-soft); color: var(--bad); }
      .note { color: var(--muted); font-size: 10px; margin-top: 6px; word-break: break-word; }
      .item.err .note { color: var(--bad); }
      .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
      .item.err .dot { background: var(--bad); }
      .item.run .dot { background: var(--blue); animation: blink 1s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      .cmd { font-weight: 600; font-size: 11px; }
      .item.err .cmd { color: var(--bad); }
      .meta { flex: none; color: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums; }

      .hint { display: flex; gap: 8px; color: var(--faint); font-size: 10px; line-height: 1.35; margin: 10px 6px 0; }
      .hint svg { width: 14px; height: 14px; margin-top: 1px; }
      button {
        margin-top: 10px; width: 100%; font: inherit; font-weight: 600; padding: 11px 12px;
        border: 0; border-radius: 999px; background: var(--blue); color: #fff; cursor: pointer;
      }
      button:hover { background: var(--blue-hover); }
      button:active { background: var(--blue-pressed); }
    </style>
  </head>
  <body>
    <header>
      <h1 class="grow">Figma MCP</h1>
      <span class="ver">v__VERSION__</span>
    </header>

    <div id="status" class="wait">

            w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
          }
          var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
          for (i = 0; i < 64; i++) {
            var t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
            var t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
            h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
          }
          H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
          H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
        }
        var out = new Uint8Array(32);
        for (i = 0; i < 8; i++) { out[4 * i] = H[i] >>> 24; out[4 * i + 1] = (H[i] >>> 16) & 255; out[4 * i + 2] = (H[i] >>> 8) & 255; out[4 * i + 3] = H[i] & 255; }
        return out;
      }
      function utf8(s) { return new TextEncoder().encode(s); }
      function toHex(b) { var s = ""; for (var i = 0; i < b.length; i++) s += (b[i] < 16 ? "0" : "") + b[i].toString(16); return s; }
      function hmacHex(key, msg) {
        var k = utf8(key); if (k.length > 64) k = sha256(k);
        var ipad = new Uint8Array(64), opad = new Uint8Array(64);
        for (var i = 0; i < 64; i++) { ipad[i] = (k[i] || 0) ^ 0x36; opad[i] = (k[i] || 0) ^ 0x5c; }
        var m = utf8(msg), inner = new Uint8Array(64 + m.length); inner.set(ipad); inner.set(m, 64);
        var ih = sha256(inner), outer = new Uint8Array(96); outer.set(opad); outer.set(ih, 64);
        return toHex(sha256(outer));
      }
      function sameHex(a, b) { if (typeof a !== "string" || a.length !== b.length) return false; var d = 0; for (var i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i); return d === 0; }
      function randomHex(n) { var b = new Uint8Array(n); crypto.getRandomValues(b); return toHex(b); }

      var ws = null, retryTimer = null, everConnected = false, authed = false, myNonce = null;
      var pending = {}, logRows = [], counts = { calls: 0, writes: 0, errors: 0 };

      var statusEl = document.getElementById("status");
      var statusText = document.getElementById("statusText");
      var fileEl = document.getElementById("file");
      var pageEl = document.getElementById("page");
      var modeEl = document.getElementById("mode");
      var allow = document.getElementById("allow");
      var allowRow = document.getElementById("allowRow");
      var allowText = document.getElementById("allowText");
      var allowWhy = document.getElementById("allowWhy");
      var logEl = document.getElementById("log");
      var lastSeenEl = document.getElementById("lastSeen");
      var reconnectBtn = document.getElementById("reconnect");

      var statusIcon = document.getElementById("statusIcon");
      function setStatus(text, cls) {
        statusText.textContent = text;
        statusEl.className = cls || "";
        icon(statusIcon, cls === "ok" ? "link" : (cls === "bad" || cls === "warn") ? "warn" : "refresh");
      }
      function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }
      function clock(d) { return d.toTimeString().slice(0, 8); }
      function dur(ms) { return ms < 1000 ? ms + "ms" : (ms / 1000).toFixed(1) + "s"; }

      function paintCounts() {
        document.getElementById("nCalls").textContent = counts.calls;
        document.getElementById("nWrites").textContent = counts.writes;
        document.getElementById("nErrors").textContent = counts.errors;
      }

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      // One line under the name: where the work happened.
      function whereLine(r) {
        var a = r.act;
        if (!a) return r.state === "run" ? "Working…" : "";
        var l = a.layers && a.layers[0];
        if (l) {
          var extra = a.layers.length > 1 ? " +" + (a.layers.length - 1) + " more" : "";
          return (l.where ? l.where + " › " : "") + l.name + extra;
        }
        return "Page: " + a.page;
      }

      function paintLog() {
        if (!logRows.length) { logEl.innerHTML = '<div class="empty">Nothing yet. Claude’s calls appear here.</div>'; return; }
        logEl.innerHTML = "";
        logRows.forEach(function (r) {
          var row = el("div", "item " + r.state + (r.open ? " open" : ""));
          var top = el("div", "top");
          top.appendChild(el("span", "dot"));
          top.appendChild(el("span", "cmd grow trunc", r.act ? r.act.label : r.command));
          top.appendChild(el("span", "meta", (r.state === "run" ? "running" : (r.state === "err" ? "failed" : dur(r.ms))) + " · " + r.at));
          row.appendChild(top);
          var where = whereLine(r);
          if (where) { var sub = el("div", "sub trunc", where); sub.title = where; row.appendChild(sub); }

          var more = el("div", "more");
          var a = r.act;
          if (a) {
            var tags = el("div", "tags");
            tags.appendChild(el("span", "tag", a.command));
            tags.appendChild(el("span", "tag", "Page: " + a.page));
            if (a.changes) {
              if (a.changes.created) tags.appendChild(el("span", "tag c", a.changes.created + " created"));
              if (a.changes.edited) tags.appendChild(el("span", "tag e", a.changes.edited + " edited"));
              if (a.changes.deleted) tags.appendChild(el("span", "tag d", a.changes.deleted + " deleted"));
            }
            more.appendChild(tags);
            (a.layers || []).forEach(function (l) {
              var box = el("div", "layer");
              var ln = el("div", "ln");
              ln.appendChild(el("span", "nm grow trunc", l.name));
              ln.appendChild(el("span", "tp", l.type));
              if (l.size) ln.appendChild(el("span", "sz", l.size));
              box.appendChild(ln);
              box.appendChild(el("div", "wh trunc", (l.where || a.page) + " · id " + l.id));
              more.appendChild(box);
            });
          }
          var note = (a && a.note) || r.error;
          if (note) more.appendChild(el("div", "note", note));
          if (more.childNodes.length) row.appendChild(more);
          row.onclick = function () { r.open = !r.open; paintLog(); };
          logEl.appendChild(row);
        });
      }

      function startCall(id, command) {
        counts.calls++;
        if (WRITE_COMMANDS[command]) counts.writes++;
        var row = { id: id, command: command, state: "run", at: clock(new Date()), t0: Date.now(), ms: 0 };
        pending[id] = row;
        logRows.unshift(row);
        logRows = logRows.slice(0, 20);
        lastSeenEl.textContent = "last " + row.at;
        paintCounts(); paintLog();
      }

      function endCall(msg) {
        var row = pending[msg.id];
        if (!row) return;
        delete pending[msg.id];
        row.ms = Date.now() - row.t0;
        row.state = msg.error ? "err" : "ok";
        if (msg.error) { counts.errors++; row.error = String(msg.error); }
        paintCounts(); paintLog();
      }

      function connect() {
        clearTimeout(retryTimer);
        reconnectBtn.hidden = true;
        ws = new WebSocket("ws://localhost:" + PORT);
        authed = false;
        ws.onopen = function () {
          // Never send the token itself: whoever holds the port must prove it knows it first.
          myNonce = randomHex(32);
          send({ hello: true, nonce: myNonce, version: VERSION });
        };
        ws.onclose = function (ev) {
          if (ev.code === 4000) { setStatus("Another Figma window took over", "warn"); reconnectBtn.hidden = false; return; }
          if (ev.code === 4401) { setStatus("Rejected: token mismatch · reopen the plugin", "bad"); reconnectBtn.hidden = false; return; }
          setStatus(everConnected ? "Claude session ended · waiting" : "Waiting for Claude…", "wait");
          retryTimer = setTimeout(connect, 2000);
        };
        ws.onerror = function () { setStatus("Waiting for Claude…", "wait"); };
        ws.onmessage = function (ev) {
          var m;
          try { m = JSON.parse(ev.data); } catch (e) { return; }
          if (!m || typeof m !== "object") return;
          if (!authed) {
            if (m.type !== "auth-challenge" || typeof m.nonce !== "string" || !sameHex(m.proof, hmacHex(TOKEN, "server|" + myNonce))) {
              // Something other than your Claude session is on this port. Tell it nothing, run nothing.
              setStatus("Rejected: port " + PORT + " is not your Claude session", "bad");
              var bad = ws; ws = null; bad.onclose = null; bad.close();
              retryTimer = setTimeout(connect, 5000);
              return;
            }
            send({ auth: hmacHex(TOKEN, "plugin|" + m.nonce) });
            authed = true;
            everConnected = true;
            setStatus("Connected to Claude · port " + PORT, "ok");
            parent.postMessage({ pluginMessage: { type: "request-state" } }, "*");
            return;
          }
          // Only commands go to the plugin. Anything else (an "allow-edits" message, say) is dropped,
          // so the bridge can never tick Allow edits; only the checkbox can.
          if (typeof m.id !== "string" || typeof m.command !== "string" || m.type !== undefined) return;
          startCall(m.id, m.command);
          parent.postMessage({ pluginMessage: { id: m.id, command: m.command, params: m.params || {} } }, "*");
        };
      }

      window.onmessage = function (event) {
        var m = event.data && event.data.pluginMessage;
        if (!m) return;
        if (m.type === "activity") {
          var r = pending[m.id] || logRows.filter(function (x) { return x.id === m.id; })[0];
          if (r) { r.act = m; paintLog(); }
          return; // panel only, never sent to the server
        }
        if (m.type === "state" && m.state) {
          var dev = m.state.editorType === "dev";
          fileEl.textContent = m.state.fileName || "(unnamed file)";
          fileEl.title = m.state.fileName || "";
          pageEl.textContent = !m.state.currentPage ? "" : (/^page\b/i.test(m.state.currentPage) ? m.state.currentPage : "Page: " + m.state.currentPage);
          modeEl.textContent = dev ? "Dev Mode" : "Design";
          modeEl.className = dev ? "chip dev" : "chip";
          if (dev) { allowWhy.textContent = "Dev Mode is read-only. Press Shift+D, then reopen the plugin."; allowWhy.style.color = "var(--warn)"; }
          else { allowWhy.style.color = ""; }
          // Keep the checkbox showing the plugin's real Allow edits state.
          if (typeof m.state.editsAllowed === "boolean" && allow.checked !== m.state.editsAllowed) { allow.checked = m.state.editsAllowed; paintAllow(); }
          send(m); // the server reads this for figma_write_status
          return;
        }
        if (m && m.id) endCall(m);
        send(m);
      };

      function paintAllow() {
        allowRow.className = "rowitem" + (allow.checked ? " on" : "");
        icon(document.getElementById("allowIcon"), allow.checked ? "edit" : "lock");
        allowText.textContent = allow.checked ? "Allow Edits · On" : "Allow Edits";
        if (modeEl.textContent !== "Dev Mode") {
          allowWhy.textContent = allow.checked
            ? "Claude can create, change and delete layers here."
            : "Claude can read this file, but not change it.";
        }
      }
      allow.onchange = function () {
        paintAllow();
        parent.postMessage({ pluginMessage: { type: "allow-edits", value: allow.checked } }, "*");
      };

      reconnectBtn.onclick = connect;
      paintCounts();
      connect();
    </script>
  </body>
</html>
